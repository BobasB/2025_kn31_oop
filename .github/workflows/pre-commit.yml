name: "Перевірка моїх комітів"

on:
  pull_request:
  push:

jobs:
  my-job-name-1:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: |
        echo "Ми виконали першу роботу!"
  
  my-job-name-2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
    - run: |
        python -c "print('Ми виконали другу роботу!')"
