name: "Різні типи запуску"

on:
  workflow_dispatch:
    inputs:
      test_output:
        description: 'Детерміновані значечення передані у тест'
        required: true
        default: '1'
        type: choice
        options:
          - 'Один'
          - '2'
          - '3-4'
      lab_number:
        description: 'Обовязковий ввід'
        required: true
        type: string

jobs:
    name_test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v7
          with:
            python-version: "3.13"
        - name: "Запуск деплою в продакшн"
          if: github.event.inputs.lab_number == 'Password'
          shell: bash
          run: |
            echo "Вивід з inputs: ${{ github.event.inputs.test_output }}"
            echo "Номер лабораторної роботи: ${{ github.event.inputs.lab_number }}"