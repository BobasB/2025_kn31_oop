[project]
name = "cov"
version = "0.1.1"
description = ""
authors = [
    {name = "BobasB",email = "bugil.bogdan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[tool.poetry]
packages = [{include = "cov", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "coverage (>=7.16.2,<8.0.0)"
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.html]
directory = "report"

[tool.coverage.report]
skip_empty = true
omit = [
    "*/tests/*",
    "test_*.py",
    "*/.venv/*"
]
exclude_lines = [
    'if __name__ == "__main__":',
    'def lambda_handler',
]
fail_under = 80
